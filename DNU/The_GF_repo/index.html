<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>I'm Sorry</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background: #fff0f3; color: #3a0b0f; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    .card { background: #fff; padding:2.5rem; border-radius:12px; box-shadow: 0 8px 30px rgba(58,11,15,0.12); max-width:720px; text-align:center; }
    h1 { margin:0 0 0.5rem 0; font-size:2.2rem; }
    p { margin:0.5rem 0 1rem 0; line-height:1.5; }
    .heart { color:#e83e6b; font-size:2rem; }
    .button { display:inline-block; margin-top:1rem; padding:0.6rem 1rem; border-radius:8px; background:#e83e6b; color:#fff; text-decoration:none; }
    footer { margin-top:1.25rem; font-size:0.9rem; color:#7a3a43; }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">❤️</div>
    <h1>I'm so sorry</h1>
    <p>I'm sorry for hurting you. I was wrong and I miss you. Please forgive me — you mean the world to me.</p>
    <a class="button" href="mailto:?subject=I%27m%20sorry&body=I%20miss%20you">Send me a message</a>
    <footer>— From Asresh</footer>
  </div>
</body>
</html>
