name: Sync projects

# Keeps the portfolio grids in step with the source project repos. Runs on a
# schedule, on demand, and whenever the data file or the sync script changes.
# scripts/sync.py reads each repo's public index (README table / MANIFEST.json),
# appends any new project, regenerates index.html, and this job commits the diff.

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours
  workflow_dispatch:            # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - "data/projects.json"
      - "scripts/sync.py"
      - ".github/workflows/sync.yml"

permissions:
  contents: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync from source repos and regenerate the grids
        run: python3 scripts/sync.py

      - name: Commit and push any changes
        run: |
          git config user.name "Asresh Kuricheti"
          git config user.email "60284496+Asresh@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "Auto-sync projects from source repos"
            git push
          else
            echo "No changes — grids already up to date."
          fi
